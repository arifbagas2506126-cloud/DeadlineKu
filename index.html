<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeadlineKu — Kelola Tugasmu, Raih Masa Depanmu</title>
<style>
:root{--navy:#082d5b;--navy2:#0b3d78;--blue:#0878e8;--sky:#eaf4ff;--line:#dceaff;--ink:#10366b;--muted:#6684ad;--green:#08a477;--red:#ef535b;--amber:#f4ad32;--bg:#f4f8fe;--white:#fff;--shadow:0 5px 18px rgba(26,91,160,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.sidebar{width:238px;background:linear-gradient(180deg,#082d5b,#061f43);color:#fff;padding:24px 14px;display:flex;flex-direction:column;flex-shrink:0}.brand{font-size:25px;font-weight:800;letter-spacing:-1px;padding:0 12px}.brand span{color:#168bfa}.tagline{font-size:11px;padding:5px 12px 25px;color:#d9eaff}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#eaf4ff;text-align:left;padding:12px;border-radius:10px;font-weight:600;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#14569b}.nav .ico{width:22px;text-align:center;font-size:18px}.semester{margin-top:auto;padding:18px 12px;color:#dceaff;line-height:1.6;font-size:12px}.main{min-width:0;flex:1}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:18px}.search{max-width:540px;flex:1;background:#eff6ff;border-radius:24px;padding:12px 17px;color:#7896bd}.search input{border:0;background:transparent;outline:0;width:90%;color:var(--ink)}.user{display:flex;align-items:center;gap:12px;font-weight:700}.avatar{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800}.content{padding:22px;max-width:1600px;margin:auto}.welcome{background:linear-gradient(100deg,#d9ecff,#b9dcff);border-radius:14px;padding:24px 30px;margin-bottom:18px;position:relative;overflow:hidden}.welcome h2{margin:0 0 8px;font-size:24px;color:#073b83}.welcome p{margin:0;color:#1265bd}.welcome:after{content:"⚑";position:absolute;right:11%;bottom:-24px;font-size:110px;color:#277bc7;opacity:.45}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:var(--shadow)}.metric{display:flex;align-items:center;gap:13px}.metric .symbol{width:48px;height:48px;border-radius:13px;background:#e7f2ff;display:grid;place-items:center;font-size:25px;color:#0756b5}.metric strong{display:block;font-size:27px;margin-top:4px}.small{font-size:12px;color:var(--muted)}.dashboard-grid{grid-template-columns:1.4fr 1fr .9fr;margin-top:14px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 13px;font-size:16px}.link{border:0;background:none;color:var(--blue);font-size:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;color:#1765bd;font-size:12px}.chip.active{background:#0752a7;color:#fff}.task{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid #edf3fb}.task:last-child{border:0}.dot{width:11px;height:11px;border-radius:50%;background:var(--blue);flex-shrink:0}.task-info{flex:1;min-width:0}.task-info b{display:block;font-size:13px}.task-info small{color:var(--muted);display:block;margin-top:4px}.pill{padding:5px 9px;border-radius:15px;font-size:11px;background:#eaf3ff;color:#0870d8;white-space:nowrap}.pill.high{background:#ffe9eb;color:#dc3d48}.pill.low{background:#e2f7f1;color:#078c6b}.notice{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #edf3fb;line-height:1.5}.notice:last-child{border:0}.notice-icon{width:32px;height:32px;border-radius:50%;background:#e7f2ff;display:grid;place-items:center;flex-shrink:0}.progress{height:9px;background:#e7f0fb;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#064a9c,#1595ef);border-radius:10px}.bottom-grid{grid-template-columns:1fr 1fr;margin-top:14px}.calendar-mini{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:11px}.calendar-mini span{padding:7px 2px;border-radius:7px}.calendar-mini .today{background:#0752a7;color:#fff}.group-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #edf3fb}.group-icon{width:42px;height:42px;border-radius:50%;background:#e5f2ff;display:grid;place-items:center;font-size:20px}.group-row .task-info{flex:1}.page-head{display:flex;justify-content:space-between;align-items:center;margin:2px 0 18px;gap:12px}.page-head h1{font-size:23px;margin:0}.btn{border:0;border-radius:8px;padding:10px 15px;background:#0752a7;color:#fff;font-weight:700}.btn.secondary{background:#edf5ff;color:#0752a7;border:1px solid var(--line)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--ink);outline-color:#79baff}.toolbar input{min-width:220px;flex:1}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:680px}.data-table th,.data-table td{text-align:left;padding:13px 10px;border-bottom:1px solid #edf3fb;font-size:12px}.data-table th{color:#6b88ad;background:#f7faff}.actions button{border:0;background:none;color:#0878e8;font-size:16px}.calendar-layout{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}.calendar-large{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.calendar-large div{background:#f7faff;border:1px solid #edf3fb;min-height:78px;padding:8px;border-radius:8px;font-size:12px}.calendar-large .dayname{background:#fff;border:0;min-height:auto;font-weight:700;color:var(--muted)}.event{display:block;margin-top:7px;background:#dceeff;color:#0752a7;padding:4px;border-radius:5px;font-size:10px}.group-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.group-card{cursor:pointer}.group-card:hover{border-color:#83baff}.group-detail{display:grid;grid-template-columns:1fr 1fr;gap:14px}.member{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #edf3fb}.member .avatar{width:30px;height:30px;font-size:11px}.chart-bars{display:flex;align-items:end;gap:15px;height:160px;padding:15px}.bar{flex:1;background:linear-gradient(#168be8,#0752a7);border-radius:7px 7px 0 0;position:relative;min-width:16px}.bar small{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);color:var(--muted)}.profile-layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700}.field textarea{min-height:85px;resize:vertical}.modal-backdrop{position:fixed;inset:0;background:#001a3880;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal-backdrop.show{display:flex}.modal{background:#fff;width:min(520px,100%);border-radius:15px;padding:22px;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.close{border:0;background:none;font-size:22px;color:var(--muted)}.mobile-nav{display:none}.empty{padding:24px;text-align:center;color:var(--muted)}
@media(max-width:1100px){.sidebar{width:205px}.dashboard-grid{grid-template-columns:1fr 1fr}.dashboard-grid .notifications-card{grid-column:span 2}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.sidebar{display:none}.topbar{height:62px;padding:0 13px}.user .user-name{display:none}.content{padding:13px 12px 78px}.welcome{padding:19px}.welcome h2{font-size:19px}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.card{padding:13px}.metric .symbol{width:38px;height:38px;font-size:20px}.metric strong{font-size:22px}.dashboard-grid,.bottom-grid,.calendar-layout,.group-detail,.profile-layout,.group-cards{grid-template-columns:1fr}.dashboard-grid .notifications-card{grid-column:auto}.page-head h1{font-size:20px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:8px 3px;z-index:4}.mobile-nav button{border:0;background:none;color:#47709f;font-size:10px;display:grid;gap:3px;justify-items:center}.mobile-nav button.active{color:#0752a7}.calendar-large div{min-height:56px;padding:5px}.calendar-large .event{font-size:8px}.search{padding:10px}.search input{font-size:12px}.topbar{gap:8px}.avatar{width:34px;height:34px}.hide-mobile{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">Deadline<span>Ku</span></div><div class="tagline">Kelola Tugasmu, Raih Masa Depanmu</div>
  <nav class="nav" id="sideNav"></nav>
  <div class="semester">🎓 &nbsp; Semester Genap<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2024/2025</div>
</aside>
<main class="main">
<header class="topbar">
  <div class="search">⌕ &nbsp;<input id="globalSearch" placeholder="Cari tugas, mata kuliah, atau kelompok..." /></div>
  <div class="user"><span>🔔<sup style="color:red">3</sup></span><div class="avatar">MF</div><div class="user-name">Muhammad Fadhan<br><span class="small">Mahasiswa</span></div></div>
</header>
<div class="content" id="view"></div>
</main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Tambah Tugas</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const navItems=[['dashboard','⌂','Dashboard'],['tasks','☷','Daftar Tugas'],['calendar','▦','Kalender'],['groups','♧','Tugas Kelompok'],['notifications','♧','Notifikasi'],['stats','▥','Statistik & Laporan'],['profile','⚙','Profil & Pengaturan']];
let current='dashboard',filter='Semua',editing=null,selectedGroup=0;
let tasks=[
{id:1,name:'Makalah Pengantar Manajemen',course:'Pengantar Manajemen',type:'Individu',date:'2026-11-22',time:'09:00',priority:'Tinggi',status:'Belum Selesai',desc:'Menyusun makalah dan daftar pustaka.'},
{id:2,name:'Laporan Praktikum',course:'Sistem Informasi',type:'Individu',date:'2026-11-24',time:'13:00',priority:'Normal',status:'Belum Selesai',desc:'Menyelesaikan laporan praktikum.'},
{id:3,name:'Presentasi Kelompok',course:'Komunikasi Bisnis',type:'Kelompok',date:'2026-11-26',time:'10:00',priority:'Rendah',status:'Belum Selesai',desc:'Menyiapkan materi presentasi.'},
{id:4,name:'Rangkuman Materi',course:'Statistika',type:'Individu',date:'2026-11-18',time:'08:00',priority:'Normal',status:'Selesai',desc:'Rangkuman bab 1 sampai 4.'}
];
let groups=[{name:'Kelompok 3',course:'Komunikasi Bisnis',members:4,progress:60,task:'Presentasi Kelompok'},{name:'Kelompok 5',course:'Desain Grafis',members:3,progress:40,task:'Proyek Desain Poster'},{name:'Kelompok 7',course:'Metodologi Penelitian',members:4,progress:25,task:'Proposal Penelitian'}];
let notices=[['🔴','Deadline tugas “Makalah Pengantar Manajemen” akan datang dalam 2 hari.','1 jam yang lalu'],['👥','Citra dan Budi menambahkan komentar di tugas kelompok “Presentasi Kelompok”.','3 jam yang lalu'],['🟡','Tugas “Laporan Praktikum” menunggu pembaruan.','5 jam yang lalu'],['🟢','Tugas “Rangkuman Materi” telah selesai.','1 hari yang lalu']];
const $=s=>document.querySelector(s);
function save(){try{localStorage.setItem('deadlineku_tasks',JSON.stringify(tasks));localStorage.setItem('deadlineku_groups',JSON.stringify(groups))}catch(e){}}
function load(){try{tasks=JSON.parse(localStorage.getItem('deadlineku_tasks'))||tasks;groups=JSON.parse(localStorage.getItem('deadlineku_groups'))||groups}catch(e){}}
function dateFmt(d){return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}
function badge(p){return `<span class="pill ${p==='Tinggi'?'high':p==='Rendah'?'low':''}">${p}</span>`}
function nav(){let html=navItems.map(([id,ic,n])=>`<button class="${current===id?'active':''}" onclick="go('${id}')"><span class="ico">${ic}</span>${n}${id==='notifications'?' 🔴':''}</button>`).join('');$('#sideNav').innerHTML=html;$('#mobileNav').innerHTML=navItems.slice(0,5).map(([id,ic,n])=>`<button class="${current===id?'active':''}" onclick="go('${id}')"><b>${ic}</b>${n}</button>`).join('')}
function go(id){current=id;nav();render();window.scrollTo(0,0)}
function pageHead(title,sub,button=''){return `<div class="page-head"><div><h1>${title}</h1><div class="small">${sub||''}</div></div>${button}</div>`}
function taskRows(arr){return arr.map(t=>`<div class="task"><span class="dot" style="background:${t.status==='Selesai'?'#08a477':t.priority==='Tinggi'?'#f4ad32':t.type==='Kelompok'?'#08a477':'#168bfa'}"></span><div class="task-info"><b>${t.name}</b><small>${t.course} · ${t.type} · ${dateFmt(t.date)} · ${t.time}</small></div>${badge(t.priority)}<button class="link" onclick="toggleDone(${t.id})" title="Ubah status">${t.status==='Selesai'?'✓':'○'}</button><button class="link" onclick="editTask(${t.id})">✎</button></div>`).join('')||'<div class="empty">Belum ada tugas yang cocok.</div>'}
function dashboard(){let done=tasks.filter(t=>t.status==='Selesai').length,upcoming=tasks.filter(t=>t.status!=='Selesai').length;return `<section class="welcome"><h2>Selamat datang, Muhammad Fadhan! 👋</h2><p>Semangat menyelesaikan tugas dan mencapai targetmu!</p></section>
<div class="grid stats">${[['▣','Total Tugas',tasks.length,'Tugas tercatat'],['◷','Deadline Dekat',upcoming,'Perlu diselesaikan'],['✓','Tugas Selesai',done,Math.round(done/Math.max(tasks.length,1)*100)+'% dari total'],['♧','Tugas Kelompok',groups.length,'Kelompok aktif']].map(x=>`<div class="card metric"><div class="symbol">${x[0]}</div><div><b>${x[1]}</b><strong>${x[2]}</strong><span class="small">${x[3]}</span></div></div>`).join('')}</div>
<div class="grid dashboard-grid">
<div class="card"><h3 class="section-title">Tugas Terbaru <button class="link" onclick="go('tasks')">Lihat Semua ›</button></h3><div class="filters">${['Semua','Individu','Kelompok'].map(f=>`<button class="chip ${filter===f?'active':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div>${taskRows(tasks.filter(t=>filter==='Semua'||t.type===filter).slice().sort((a,b)=>a.date.localeCompare(b.date)))}</div>
<div class="card"><h3 class="section-title">Deadline Mendatang <button class="link" onclick="go('calendar')">Lihat Semua ›</button></h3>${tasks.filter(t=>t.status!=='Selesai').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4).map(t=>`<div class="task"><div class="symbol" style="width:44px;height:44px;border-radius:10px;font-weight:800">${new Date(t.date+'T00:00:00').getDate()}<small>${new Date(t.date+'T00:00:00').toLocaleDateString('id-ID',{month:'short'}).toUpperCase()}</small></div><div class="task-info"><b>${t.name}</b><small>${t.course} · ${t.time}</small></div>${badge(t.priority)}</div>`).join('')}<p class="small">Progress keseluruhan</p><div class="progress"><span style="width:${done/Math.max(tasks.length,1)*100}%"></span></div><p class="small">${done} dari ${tasks.length} tugas selesai</p></div>
<div class="card notifications-card"><h3 class="section-title">Notifikasi <button class="link" onclick="go('notifications')">Lihat Semua ›</button></h3>${notices.slice(0,4).map(n=>`<div class="notice"><div class="notice-icon">${n[0]}</div><div>${n[1]}<div class="small">${n[2]}</div></div></div>`).join('')}</div></div>
<div class="grid bottom-grid"><div class="card"><h3 class="section-title">Kalender Akademik <button class="link" onclick="go('calendar')">Lihat Semua ›</button></h3>${miniCalendar()}</div><div class="card"><h3 class="section-title">Tugas Kelompok Aktif <button class="link" onclick="go('groups')">Lihat Semua ›</button></h3>${groups.slice(0,3).map(groupRow).join('')}</div></div>`}
function miniCalendar(){let days=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];return `<div class="calendar-mini">${days.map(d=>`<b>${d}</b>`).join('')}${Array.from({length:35},(_,i)=>`<span class="${i===19?'today':''}">${i<3?'':i-2}</span>`).join('')}</div>`}
function groupRow(g,i){return `<div class="group-row" onclick="selectedGroup=${i};go('groupDetail')"><div class="group-icon">♧</div><div class="task-info"><b>${g.name} · ${g.course}</b><small>${g.members} anggota · ${g.task}</small><div class="progress" style="margin-top:7px"><span style="width:${g.progress}%"></span></div></div><b>${g.progress}%</b></div>`}
function tasksPage(){return `${pageHead('Daftar Tugas','Kelola semua tugasmu di satu tempat.',`<button class="btn" onclick="openTask()">＋ Tambah Tugas</button>`)}<div class="card"><div class="toolbar"><input id="taskSearch" placeholder="⌕ Cari tugas..." oninput="renderTaskTable()"><select id="typeFilter" onchange="renderTaskTable()"><option>Semua</option><option>Individu</option><option>Kelompok</option></select><select id="statusFilter" onchange="renderTaskTable()"><option>Semua Status</option><option>Belum Selesai</option><option>Selesai</option></select><select id="priorityFilter" onchange="renderTaskTable()"><option>Semua Prioritas</option><option>Tinggi</option><option>Normal</option><option>Rendah</option></select></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Nama Tugas</th><th>Mata Kuliah</th><th>Jenis</th><th>Deadline</th><th>Status</th><th>Prioritas</th><th>Aksi</th></tr></thead><tbody id="taskTable"></tbody></table></div></div>`}
function renderTaskTable(){let q=($('#taskSearch')?.value||'').toLowerCase(),ty=$('#typeFilter')?.value||'Semua',st=$('#statusFilter')?.value||'Semua Status',pr=$('#priorityFilter')?.value||'Semua Prioritas';let arr=tasks.filter(t=>(t.name+' '+t.course).toLowerCase().includes(q)&&(ty==='Semua'||t.type===ty)&&(st==='Semua Status'||t.status===st)&&(pr==='Semua Prioritas'||t.priority===pr));$('#taskTable').innerHTML=arr.map(t=>`<tr><td><b>${t.name}</b></td><td>${t.course}</td><td>${t.type}</td><td>${dateFmt(t.date)}</td><td><span class="pill ${t.status==='Selesai'?'low':'high'}">${t.status}</span></td><td>${badge(t.priority)}</td><td class="actions"><button onclick="editTask(${t.id})">✎</button><button onclick="deleteTask(${t.id})">⌫</button></td></tr>`).join('')||'<tr><td colspan="7">Tidak ada tugas.</td></tr>'}
function calendarPage(){let names=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];return `${pageHead('Kalender','Lihat semua deadline dan jadwal tugasmu.')}<div class="calendar-layout"><div class="card"><h3 class="section-title"><button class="link" onclick="changeMonth(-1)">‹</button><span id="monthLabel">November 2026</span><button class="link" onclick="changeMonth(1)">›</button></h3><div class="calendar-large" id="calendarGrid">${names.map(n=>`<div class="dayname">${n}</div>`).join('')}</div></div><div class="card"><h3 class="section-title">Agenda Mendatang</h3>${taskRows(tasks.slice().sort((a,b)=>a.date.localeCompare(b.date)))}</div></div>`}
let calMonth=10,calYear=2026;
function drawCalendar(){let grid=$('#calendarGrid');if(!grid)return;$('#monthLabel').textContent=new Date(calYear,calMonth,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'});let first=new Date(calYear,calMonth,1).getDay(),count=new Date(calYear,calMonth+1,0).getDate();grid.innerHTML=['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(n=>`<div class="dayname">${n}</div>`).join('');for(let i=0;i<first;i++)grid.innerHTML+='<div></div>';for(let d=1;d<=count;d++){let ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,events=tasks.filter(t=>t.date===ds);grid.innerHTML+=`<div><b>${d}</b>${events.map(t=>`<span class="event">${t.name}</span>`).join('')}</div>`}}
function changeMonth(n){calMonth+=n;if(calMonth<0){calMonth=11;calYear--}if(calMonth>11){calMonth=0;calYear++}drawCalendar()}
function groupsPage(){return `${pageHead('Tugas Kelompok','Kelola tugas kelompok dan pantau progres bersama.',`<button class="btn" onclick="openGroup()">＋ Buat Kelompok</button>`)}<div class="grid group-cards">${groups.map((g,i)=>`<div class="card group-card" onclick="selectedGroup=${i};go('groupDetail')"><div class="group-row"><div class="group-icon">♧</div><div class="task-info"><b>${g.name}</b><small>${g.course}</small></div><span class="pill">Aktif</span></div><p class="small">${g.members} anggota · ${g.task}</p><div class="progress"><span style="width:${g.progress}%"></span></div><p class="small">${g.progress}% progres kelompok</p><button class="link">Lihat Detail ›</button></div>`).join('')}</div>`}
function groupDetail(){let g=groups[selectedGroup]||groups[0];return `${pageHead('‹ Kembali ke Tugas Kelompok','Detail Tugas Kelompok',`<button class="btn secondary" onclick="go('groups')">Kembali</button>`)}<div class="card"><h2>${g.task} <span class="pill low">Aktif</span></h2><p class="small">${g.course} · ${g.name}</p><div class="progress"><span style="width:${g.progress}%"></span></div><p>${g.progress}% progres kelompok</p></div><div class="grid group-detail" style="margin-top:14px"><div class="card"><h3>Anggota Kelompok (${g.members})</h3>${['Muhammad Fadhan','Andi Pratama','Citra Lestari','Budi Santoso'].slice(0,g.members).map((m,i)=>`<div class="member"><div class="avatar">${m.split(' ').map(x=>x[0]).join('')}</div><b>${m}</b><span class="small">${i===0?'Ketua':'Anggota'}</span></div>`).join('')}</div><div class="card"><h3>Subtugas</h3>${['Mencari referensi','Membuat PPT','Menyusun materi','Rehearsal presentasi'].map((s,i)=>`<div class="task"><input type="checkbox" ${i<2?'checked':''}> <div class="task-info">${s}</div><span class="small">${i<2?'Selesai':'Belum'}</span></div>`).join('')}<h3>Komentar</h3><div class="field"><textarea placeholder="Tulis komentar untuk kelompok..."></textarea></div><button class="btn" onclick="toast('Komentar ditambahkan (demo).')">Kirim Komentar</button></div></div>`}
function notificationsPage(){return `${pageHead('Notifikasi','Pengingat tugas dan informasi terbaru.')}<div class="card">${notices.map(n=>`<div class="notice"><div class="notice-icon">${n[0]}</div><div style="flex:1">${n[1]}<div class="small">${n[2]}</div></div><span class="pill">Baru</span></div>`).join('')}</div>`}
function statsPage(){let done=tasks.filter(t=>t.status==='Selesai').length;return `${pageHead('Statistik & Laporan','Lihat perkembangan tugas dan produktivitasmu.')}<div class="grid stats"><div class="card"><span class="small">Total Tugas</span><h1>${tasks.length}</h1></div><div class="card"><span class="small">Selesai</span><h1>${done}</h1></div><div class="card"><span class="small">Belum Selesai</span><h1>${tasks.length-done}</h1></div><div class="card"><span class="small">Kelompok Aktif</span><h1>${groups.length}</h1></div></div><div class="grid bottom-grid"><div class="card"><h3>Status Tugas</h3><div class="progress"><span style="width:${done/Math.max(tasks.length,1)*100}%"></span></div><p>${Math.round(done/Math.max(tasks.length,1)*100)}% tugas telah selesai</p></div><div class="card"><h3>Produktivitas Mingguan</h3><div class="chart-bars">${[35,55,42,80,60,95,68].map((h,i)=>`<div class="bar" style="height:${h}%"><small>${['Sen','Sel','Rab','Kam','Jum','Sab','Min'][i]}</small></div>`).join('')}</div></div></div>`}
function profilePage(){return `${pageHead('Profil & Pengaturan','Ubah informasi profil dan pengaturan akunmu.')}<div class="grid profile-layout"><div class="card"><div class="user" style="margin-bottom:20px"><div class="avatar" style="width:65px;height:65px;font-size:22px">MF</div><div>Muhammad Fadhan<div class="small">Mahasiswa</div></div></div><h3>Informasi Akun</h3><div class="field"><label>Nama Lengkap</label><input value="Muhammad Fadhan"></div><div class="field"><label>Email</label><input type="email" value="m.fadhan@student.ac.id"></div><div class="field"><label>NIM</label><input value="2023100001"></div></div><div class="card"><h3>Preferensi</h3><div class="field"><label>Semester Aktif</label><select><option>Genap 2024/2025</option><option>Ganjil 2025/2026</option></select></div><div class="field"><label>Program Studi</label><select><option>Sistem Informasi</option><option>Manajemen</option><option>Teknik Informatika</option></select></div><div class="field"><label>Pengingat Deadline</label><select><option>H-1 dan H-3</option><option>H-1 saja</option><option>H-3 saja</option></select></div><button class="btn" onclick="toast('Pengaturan disimpan (demo).')">Simpan Perubahan</button></div></div>`}
function render(){let html={dashboard,tasks:tasksPage,calendar:calendarPage,groups:groupsPage,groupDetail,notifications:notificationsPage,stats:statsPage,profile:profilePage}[current]();$('#view').innerHTML=html;if(current==='tasks')renderTaskTable();if(current==='calendar')drawCalendar()}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
function openTask(){editing=null;openModal('Tambah Tugas',`<div class="field"><label>Jenis Tugas</label><select id="fType"><option>Individu</option><option>Kelompok</option></select></div><div class="field"><label>Nama Tugas</label><input id="fName" placeholder="Contoh: Makalah Pengantar Manajemen"></div><div class="field"><label>Mata Kuliah</label><input id="fCourse" placeholder="Nama mata kuliah"></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Deadline</label><input id="fDate" type="date" value="2026-11-25"></div><div class="field"><label>Waktu</label><input id="fTime" type="time" value="23:59"></div></div><div class="field"><label>Prioritas</label><select id="fPriority"><option>Normal</option><option>Tinggi</option><option>Rendah</option></select></div><div class="field"><label>Deskripsi</label><textarea id="fDesc" placeholder="Jelaskan detail tugas..."></textarea></div><button class="btn" onclick="saveTask()">Simpan Tugas</button>`)}
function editTask(id){let t=tasks.find(x=>x.id===id);if(!t)return;editing=id;openTask();$('#modalTitle').textContent='Edit Tugas';$('#fType').value=t.type;$('#fName').value=t.name;$('#fCourse').value=t.course;$('#fDate').value=t.date;$('#fTime').value=t.time;$('#fPriority').value=t.priority;$('#fDesc').value=t.desc}
function saveTask(){let name=$('#fName').value.trim();if(!name){alert('Nama tugas harus diisi.');return}let data={name,course:$('#fCourse').value.trim()||'Umum',type:$('#fType').value,date:$('#fDate').value,time:$('#fTime').value,priority:$('#fPriority').value,desc:$('#fDesc').value,status:'Belum Selesai'};if(editing){Object.assign(tasks.find(t=>t.id===editing),data)}else{data.id=Date.now();tasks.push(data)}save();closeModal();render();toast('Tugas berhasil disimpan.')}
function deleteTask(id){if(confirm('Hapus tugas ini?')){tasks=tasks.filter(t=>t.id!==id);save();render();if(current==='tasks')renderTaskTable()}}
function toggleDone(id){let t=tasks.find(t=>t.id===id);t.status=t.status==='Selesai'?'Belum Selesai':'Selesai';save();render()}
function openGroup(){openModal('Buat Kelompok',`<div class="field"><label>Nama Kelompok</label><input id="gName" placeholder="Contoh: Kelompok 1"></div><div class="field"><label>Mata Kuliah</label><input id="gCourse" placeholder="Nama mata kuliah"></div><div class="field"><label>Nama Proyek</label><input id="gTask" placeholder="Nama tugas kelompok"></div><button class="btn" onclick="saveGroup()">Buat Kelompok</button>`)}
function saveGroup(){let name=$('#gName').value.trim();if(!name){alert('Nama kelompok harus diisi.');return}groups.push({name,course:$('#gCourse').value||'Umum',task:$('#gTask').value||'Proyek kelompok',members:1,progress:0});save();closeModal();render();toast('Kelompok dibuat.')}
function toast(msg){let el=document.createElement('div');el.textContent=msg;el.style='position:fixed;bottom:25px;right:25px;background:#082d5b;color:white;padding:13px 18px;border-radius:9px;z-index:10;box-shadow:0 5px 20px #0002';document.body.append(el);setTimeout(()=>el.remove(),2500)}
$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){go('tasks');setTimeout(()=>{let s=$('#taskSearch');if(s){s.value=e.target.value;renderTaskTable()}},20)}});
load();nav();render();
</script>
</body>
</html>
